{% extends "base.html" %}

{% block title %}Actualizar proveedor{% endblock %}

{% block content %}
    <div class="encabezado-body">
        <h1>Actualizar nuevo proveedor</h1>
        <a class="boton" href="{% url 'proveedores:lista' %}">Volver a la lista de proveedores</a>
    </div>

    <div class="contenedor-body">
        <form action="{% url "proveedores:actualizar" proveedor.id %}" method="POST">
            {% csrf_token %}
            <p>
                <label>Razón social</label>
                <input type="text" id="razon_social" name='razon_social' value="{{ proveedor.razon_social }}" required>
            </p>

            <p>
                <label>NIT/RUT</label>
                <input type="text" id="nit_rut" name='nit_rut' value="{{ proveedor.nit_rut }}" required>
            </p>

            <p>
                <label>Email</label>
                <input type="email" id="email" name='email' value="{{ proveedor.email }}" required>
            </p>

            <p>
                <label>Teléfono</label>
                <input type="text" id="telefono" name='telefono' value="{{ proveedor.telefono }}" required>
            </p>

            <button class="boton" type="submit">Guardar proveedor</button>
    </div>
{% endblock %}
