{% extends "base.html" %}

{% block title %}Crear nuevo movimiento{% endblock %}

{% block content %}
    <div class="encabezado-body">
        <h1>Crear nuevo movimiento</h1>
        <a class="boton" href="{% url 'movimientos:listar' %}">Volver a todo el inventario</a>
    </div>

    <div class="contenedor-body">
        <form>
        {% comment %} <form hx-post="{% url "movimientos:crear" %}" hx-target="#resultado" hx-swap="outerHTML">
            {% csrf_token %} {% endcomment %}

            
                <div>
                    <label for="producto">Elije un producto: </label>
                    <select name="producto" id="producto" required>
                        <option value="" selected disabled>-- Selecciona un producto --</option>
                        {% for p in productos %}
                            <option value="{{ p.id }}">{{ p.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="almacen">Elije un almacén: </label>
                    <select name="almacen" id="almacen" required>
                        <option value="" selected disabled>-- Selecciona un almacen --</option>
                        {% for a in almacenes %}
                            <option value="{{ a.id }}">{{ a.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="cantidad">Cantidad</label>
                    <input type="number" value='1' name="cantidad" id="cantidad" required>
                </div>
            
            <button class="boton" type="submit">Guardar proveedor</button>
        </form>
    </div>
{% endblock %}
