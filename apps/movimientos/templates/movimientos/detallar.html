{% extends "base.html" %}

{% block title %}Detalle de stock{% endblock %}

{% block content %}
    <div class="encabezado-body">
        <h1>Detalle de stock: {{ movimiento.producto.nombre }}</h1>
        <a class="boton" href="{% url "movimientos:listar" %}">⬅️ Volver a todo el inventario</a>
    </div>

    <div class="contenedor-body">
        <div
            hx-get="{% url "movimientos:detalle" movimiento.pk %}"
            hx-trigger="load"
            hx-swap="outerHTML">
            <p>Cargando detalle de stock...</p>
        </div>
    </div>
{% endblock %}
