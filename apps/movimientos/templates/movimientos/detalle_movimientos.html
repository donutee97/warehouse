{% extends "base.html" %}

{% block title %}Detalle de movimiento{% endblock %}

{% block content %}
    <div class="encabezado-body">
        <h1>Detalle de movimiento</h1>
        <a class="boton" href="{% url "movimientos:movimientos_stock" %}">⬅️ Volver a la lista de proveedores</a>
    </div>

    <div class="contenedor-body">
        <div
            hx-get="{% url "movimientos:detalle" movimiento.pk %}"
            hx-trigger="load"
            hx-swap="outerHTML">
            <p>Cargando detalle de movimiento...</p>
        </div>
    </div>
{% endblock %}
